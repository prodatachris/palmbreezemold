# Server config for the Palm Breeze Mold container.
#
# A SEPARATE FILE rather than a heredoc inside the Dockerfile, because
# `COPY <<'EOF'` is BuildKit syntax and Cloud Build's legacy builder parses it
# as instructions: the first attempt failed with "unknown instruction: SERVER".
#
# THE HEADERS HERE ARE public/_headers TRANSLATED. That file is read natively
# only by Netlify and Cloudflare Pages and is silently inert everywhere else,
# which the file itself warns about. If one changes, change both: they are two
# statements of one policy and nothing checks that they agree.
#
# add_header does NOT inherit into a location that sets its own, which is why
# the three security headers are repeated in each block rather than set once at
# server level. Dropping them from a location would quietly serve assets
# without them.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # The generator writes directories containing index.html, so /services/ and
  # /services must both resolve rather than 404 on the missing slash.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Content-hashed: a year, immutable.
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # NOT content-hashed: an hour. Raise these the day build.mjs hashes them.
  location = /styles.css {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /site.js {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
}
